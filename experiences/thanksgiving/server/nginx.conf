# Online version, gated by season. Used by docker-compose.yml (or drop into an existing nginx + PHP-FPM).
# Every request is decided by gate/gate.php; nothing is served straight from disk, so nothing can be
# reached out of season by typing a file's URL. In season, nginx still sends the files itself.
server {
    listen 80;
    server_name thanksgiving.theoutreachcc.com;   # change to your hostname

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/app/gate/gate.php;
        fastcgi_param SCRIPT_NAME     /gate/gate.php;
        fastcgi_param GATE_MODE       accel;      # gate answers with X-Accel-Redirect to /_release/
        fastcgi_param GATE_BASE       /;
        fastcgi_param GATE_ROOT       /srv/app;
        fastcgi_pass  thanksgiving-gate:9000;
    }

    # Files the gate has released. "internal" = can't be requested from outside.
    location /_release/ {
        internal;
        alias /srv/app/;
    }
}
