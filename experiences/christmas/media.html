<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Christmas Experience Media</title>
<meta name="description" content="Media edition test: Station 1 built from your own AI-generated clips and images.">
<meta name="theme-color" content="#070b22">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-50 -50 100 100'><rect x='-50' y='-50' width='100' height='100' rx='20' fill='%23070b22'/><polygon points='0,-40 8,-8 40,0 8,8 0,40 -8,8 -40,0 -8,-8' fill='%23f0c26a'/></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ HOME (online version) ============ -->
<section id="home" class="screen">
  <div class="sky" id="homeSky"></div>
  <div class="home-inner">
    <div class="eyebrow" id="homeEyebrow"></div>
    <h1 class="title" id="homeTitle"></h1>
    <p class="tagline" id="homeTag"></p>
    <button class="btn-begin" id="begin">
      <svg width="22" height="22" viewBox="-12 -12 24 24" aria-hidden="true"><polygon points="0,-11 3,-3 11,0 3,3 0,11 -3,3 -11,0 -3,-3" fill="#2a1a00"/></svg>
      Begin the journey
    </button>
    <div class="stations-grid" id="grid"></div>
    <p class="home-foot" id="homeFoot"></p>
  </div>
</section>

<!-- ============ STAGE (stations) ============ -->
<section id="stage" class="screen">
  <div class="stage-wrap">
    <div class="scene" id="scene"></div>
  </div>

  <div class="rotate-hint">⟳ Turn your phone sideways for the best view</div>
  <div class="badge"><div class="num" id="badgeNum">1</div><div class="txt"><b id="badgeTitle"></b><span id="badgeSub"></span></div></div>
  <div class="dots" id="dots"></div>

  <nav class="nav" aria-label="Station controls">
    <button class="navbtn" id="homeBtn" aria-label="All stations"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7M5 10v10h14V10"/></svg></button>
    <button class="navbtn" id="prevBtn" aria-label="Previous station"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="navbtn" id="replayBtn" aria-label="Hear that again"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5"/></svg></button>
    <button class="navbtn" id="ccBtn" aria-label="Captions: follow along (click to change)"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10.5 10.2a2.2 2.2 0 1 0 0 3.6M17 10.2a2.2 2.2 0 1 0 0 3.6"/></svg><i class="cc-mark"></i></button>
    <button class="navbtn" id="muteBtn" aria-label="Turn narration off"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zM17 9a4 4 0 0 1 0 6"/></svg></button>
    <button class="navbtn" id="nextBtn" aria-label="Next station"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </nav>

  <div class="verse" id="verse" aria-live="polite"></div>
  <div class="caption" id="caption" aria-live="polite"></div>
  <div class="singalong" id="singalong" aria-live="polite"></div>
  <div class="prompt" id="prompt" role="button" aria-label="Continue"><span class="go">GO</span><span id="promptText">Press GO</span></div>

  <div class="invite" id="invite"></div>
  <div class="carol-ui" id="carolUI" hidden></div>
  <div class="endcard" id="endcard"></div>
  <div class="attract" id="attract"></div>
</section>

<script src="vendor/qrcode.js"></script>
<script src="audio/narration/manifest.js"></script>
<script src="js/content.js"></script>
<script src="js/audio.js"></script>
<script src="js/bridge.js"></script>
<script src="js/scenes.js"></script>
<script src="js/scenes-media.js"></script>
<script>window.EDITION = { id: "media", stations: ["promise"], carols: false, title: "The Christmas Experience", tagline: "Realistic edition · Station 1 preview" };</script>
<script src="js/season.js"></script>
<script src="js/app.js"></script>
</body>
</html>
